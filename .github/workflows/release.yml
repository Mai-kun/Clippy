name: Release

# A tag is the only trigger. Building on every push would spend ~2 minutes of AOT compile on
# commits that never ship, and Native AOT is the slowest step in the whole pipeline.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Native AOT needs a C++ linker, which the hosted windows-latest image does not have.
      # Without this the publish fails at the very last step with an LNK1181 about link.exe.
      - name: Enable AOT prerequisites
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath `
            -format value

      # The selftests shell out to ffprobe, and a clean windows-latest image has neither ffmpeg nor
      # ffprobe on PATH. Without this the --test-mp4 step dies with a Win32Exception about a missing
      # file, which reads like a Clippy bug and is not one.
      #
      # Fetched from gyan.dev's *essentials* build rather than setup-ffmpeg's "release", because the
      # full build is ~217 MB and nearly all of it is payload Clippy never uses: it carries a dozen
      # encoders and their tables, while the runtime path only ever reaches for h264_nvenc. Essentials
      # has that and cuts the download to roughly a third.
      #
      # Both exes are unpacked, and then only ffmpeg.exe goes into publish/. ffprobe goes on PATH for
      # the selftests on this runner and no further: Clippy never calls it at runtime, so shipping it
      # would add tens of megabytes that no user could ever benefit from.
      - name: Fetch FFmpeg (essentials build)
        shell: pwsh
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          $work = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          $zip = Join-Path $work 'ffmpeg-essentials.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          "downloaded: {0:N1} MB" -f ((Get-Item $zip).Length / 1MB)

          Expand-Archive -Path $zip -DestinationPath $work -Force
          $bin = Get-ChildItem $work -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          if (-not $bin) { throw 'ffmpeg.exe is not inside the essentials archive' }

          $ffprobe = Join-Path $bin.DirectoryName 'ffprobe.exe'
          if (-not (Test-Path $ffprobe)) { throw 'ffprobe.exe is not inside the essentials archive' }

          # PATH first: the selftests below need ffprobe, and this step is now the only thing that
          # provides it, since setup-ffmpeg is gone.
          $binDir = $bin.DirectoryName
          "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$binDir;$env:PATH"

          "ffmpeg : {0:N1} MB" -f ((Get-Item $bin.FullName).Length / 1MB)
          "ffprobe: {0:N1} MB (test-only, not shipped)" -f ((Get-Item $ffprobe).Length / 1MB)

      # clippy_nvenc.dll is the native NVENC bridge. It has to exist BEFORE publish, because the
      # csproj has a target that copies it into the publish directory only when the file is already
      # on disk at the moment the project is evaluated. Building it afterwards would leave a
      # release whose encoder silently falls back to ffmpeg.
      #
      # Strict on failure. A missing DLL is not a warning here: every other path still works, so a
      # soft failure would ship a release that quietly lost its headline feature.
      - name: Build the native NVENC bridge
        shell: cmd
        run: |
          call src\native\build.cmd
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%

      - name: Publish (Native AOT)
        run: >
          dotnet publish src/Clippy.csproj
          -c Release
          -r win-x64
          -p:PublishAot=true
          -o publish

      # Runs immediately after publish, BEFORE anything is deleted, moved or copied. The selftests
      # must judge the binary exactly as dotnet produced it, not a folder this workflow has been
      # rearranging underneath them. ffprobe comes from the runner's PATH (setup-ffmpeg above), so
      # nothing here has to preserve a copy.
      - name: Verify the selftests
        shell: pwsh
        run: |
          # A green build that cannot write an MP4 is not a release. These run against the
          # published native binary, not a dotnet-hosted one, so AOT trimming shows up here.
          $exe = 'publish/Clippy.exe'
          if (-not (Test-Path $exe)) { throw "publish/Clippy.exe is missing" }

          # Loudly confirm the tool the mp4 checks depend on is really reachable. Without this the
          # ffprobe-dependent checks would SKIP and the release would ship with them unverified.
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            throw 'ffprobe is not on PATH; --test-mp4 would silently skip its deep checks'
          }

          # The native bridge must be in the output, not merely on the build machine. The encoder
          # treats a missing DLL as "no hardware encoder here" and falls back to ffmpeg, so a release
          # that lost it would still install and still record -- just without the feature, and with
          # nothing in the logs to say why.
          $nvenc = 'publish/clippy_nvenc.dll'
          if (-not (Test-Path $nvenc)) { throw "clippy_nvenc.dll is missing from the publish directory!" }
          "ok  clippy_nvenc.dll ({0:N0} bytes)" -f (Get-Item $nvenc).Length

          foreach ($t in '--test-parsers', '--test-ring', '--test-mp4', '--test-audio-timeline') {
            & $exe $t
            if ($LASTEXITCODE -ne 0) { throw "$t failed with exit $LASTEXITCODE" }
            "ok  $t"
          }

      # 26 MB of symbols that no end user can do anything with. Uploading them to a separate
      # asset would let a crash reporter symbolicate later, which is worth doing when there is
      # actually a crash reporter; today it is just a slow download.
      - name: Drop debug symbols
        shell: pwsh
        run: |
          $pdb = 'publish/Clippy.pdb'
          if (Test-Path $pdb) {
            Remove-Item $pdb
            "removed $pdb"
          } else {
            "no Clippy.pdb produced"
          }

      - name: Stage user files
        shell: pwsh
        run: |
          Copy-Item README.md publish/README.md
          Copy-Item config.example.json publish/config.example.json

      # Ship ffmpeg inside the archive. It is not committed to the repo, so the repository does not
      # grow by ~80 MB, and the user gets a folder that works with no setup at all. FfmpegLocator
      # prefers a bundled ffmpeg.exe over PATH, so dropping it next to Clippy.exe is enough.
      #
      # ffprobe is deliberately NOT shipped. Clippy never calls it at runtime -- only the selftests
      # do, and those run here on the runner -- so bundling it would add ~200 MB of nothing to a
      # download. Its absence costs a user nothing beyond being unable to re-run --test-mp4 locally.
      - name: Bundle ffmpeg
        shell: pwsh
        run: |
          $ffmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source
          Copy-Item $ffmpeg publish/ffmpeg.exe
          Get-Item publish/ffmpeg.exe | Select-Object Name, Length

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        shell: pwsh
        run: |
          # A stale setup from an earlier run would be uploaded as if it were this release's, so the
          # output directory starts empty.
          Remove-Item artifacts -Recurse -Force -ErrorAction SilentlyContinue

          # ISCC does not land on PATH in a fresh runner shell, so it is located the way Inno
          # itself documents: under Program Files, by directory name.
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*","${env:ProgramFiles}\Inno Setup*" `
                    -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup' }

          # The tag is the single source of truth for the version, so the installer and the
          # updater can never disagree about what release this is.
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not $version) { $version = '0.0.0' }

          & $iscc.FullName "/DPublishVersion=$version" "installer\clippy.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }

          Get-ChildItem artifacts -Filter 'Clippy-Setup.exe' |
            Select-Object Name, @{n='MB'; e={ [math]::Round($_.Length/1MB, 2) } }

      - name: Package
        shell: pwsh
        run: |
          # Optimal, not NoCompression. That was the right call when the archive held a 6 MB native
          # exe, which deflate cannot improve. It stopped being right once ffmpeg (~200 MB of
          # libraries and tables) went in: a stored archive was 443 MB, and deflating the same
          # payload costs a second or two of packaging and takes it to roughly 40 MB.
          # The zip keeps the name it has always had. Renaming it to "...-portable.zip" looks tidier
          # but strands every existing copy: the updater in those builds looks for the old name,
          # would find nothing in this release, and would silently stop updating. The installer does
          # not have that problem, because it is a brand new asset nobody looks for yet.
          Compress-Archive -Path publish/* -DestinationPath Clippy-win-x64.zip -CompressionLevel Optimal

          $zip = Get-Item Clippy-win-x64.zip
          "archive: {0:N1} MB" -f ($zip.Length / 1MB)
          "contents:"
          Get-ChildItem publish | Select-Object Name, Length

      # Submits the installer to microsoft/winget-pkgs so `winget install Mai-kun.Clippy` works.
      # Requires a WINGET_TOKEN repository secret holding a PAT with the public_repo scope.
      #
      # A failure here does NOT fail the release: the GitHub release and both installers are already
      # published by the time this runs, and losing the package manager listing is recoverable while a
      # red X on the release is not. So the step is allowed to fail and the next one is what marks
      # the workflow green.
      - name: Submit to Windows Package Manager (Winget)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: Mai-kun.Clippy
          installer-type: inno
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # Both shapes ship on every release. The setup is what most people want; the zip is for
          # anyone who cannot or will not install, and it is the only one a portable copy can update
          # itself from -- UpdateService picks by whether unins000.exe sits next to the exe. The zip
          # keeps its long-standing name on purpose: renaming it would strand existing copies.
          files: |
            artifacts/Clippy-Setup.exe
            Clippy-win-x64.zip
          # Without this, a mistyped or moved asset is silently skipped and the release ships half
          # the files it claims to. That is exactly what happened: the setup was written to
          # artifacts\ while this glob looked in the repository root, and the first v1.0.4 release
          # published a zip and no installer without failing a single step.
          fail_on_unmatched_files: true
          # ${{ github.ref_name }} is the tag, so v1.2.3 names the release v1.2.3.
          name: Clippy ${{ github.ref_name }}
          body: |
            Два варианта на выбор.

            **`Clippy-Setup.exe`** — установщик. Ставится в `%LOCALAPPDATA%\Programs\Clippy` без
            прав администратора, создаёт ярлык в меню «Пуск», умеет запускаться при старте Windows
            и обновляется сам.

            **`Clippy-win-x64.zip`** — распакуйте в любую папку и запустите `Clippy.exe`.
            Ничего не устанавливается.

            `ffmpeg.exe` уже внутри обоих вариантов, отдельно ничего ставить не нужно.

            Горячие клавиши: **F9** — 30 секунд, **F10** — 3 минуты.
            Клипы в `clips/`, отладочные логи в `logs/`.
          draft: false
          generate_release_notes: true

